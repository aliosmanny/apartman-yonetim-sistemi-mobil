appId: com.example.apartman_yonetim_sistemi_mobil
---
# ══════════════════════════════════════════════════════════════════
# 1. SAKİN / MALİK GİRİŞİ
# ══════════════════════════════════════════════════════════════════
- launchApp:
    clearState: true
- tapOn: "5XX XXX XX XX"
- inputText: "5353641829"
- tapOn: "••••••••"
- inputText: "123412341234"
- hideKeyboard
- tapOn: "Giriş Yap"
- waitForAnimationToEnd:
    timeout: 8000

# ══════════════════════════════════════════════════════════════════
# 2. ANA SAYFA, BİLDİRİMLER VE KISAYOLLAR
# ══════════════════════════════════════════════════════════════════
# 2.1. Sağ üstteki Bildirim Zil İkonuna tıkla (x: 76%, y: 15%)
- tapOn:
    point: "76%, 15%"
- waitForAnimationToEnd:
    timeout: 3000

# Bildirimler sayfasını kaydır ve geri dön
- swipe:
    direction: UP
    duration: 500
- tapOn:
    point: "6%, 6%"
- waitForAnimationToEnd:
    timeout: 2000

# 2.2. Kısayol: Borç Kartı Butonu
- tapOn: "Borçlarımı Görüntüle"
- waitForAnimationToEnd:
    timeout: 2500
# Ana Sayfaya Geri Dön (Sekme 0)
- tapOn:
    point: "10%, 90%"
- waitForAnimationToEnd:
    timeout: 2000

# 2.3. Kısayol: Talep Oluştur Formu
- tapOn: "Talep.*"
- waitForAnimationToEnd:
    timeout: 2500
- swipe:
    direction: UP
    duration: 400
- tapOn:
    point: "6%, 6%"
- waitForAnimationToEnd:
    timeout: 2000

# 2.4. Kısayol: Duyurular
- tapOn: "Duyurular"
- waitForAnimationToEnd:
    timeout: 2500
# Ana Sayfaya Geri Dön
- tapOn:
    point: "10%, 90%"
- waitForAnimationToEnd:
    timeout: 2000

# 2.5. Kısayol: Sözleşmem
- tapOn: "Sözleşmem"
- waitForAnimationToEnd:
    timeout: 2500
# Ana Sayfaya Geri Dön
- tapOn:
    point: "10%, 90%"
- waitForAnimationToEnd:
    timeout: 2000

# 2.6. Kısayol: Profilim
- tapOn: "Profilim"
- waitForAnimationToEnd:
    timeout: 2500
# Ana Sayfaya Geri Dön
- tapOn:
    point: "10%, 90%"
- waitForAnimationToEnd:
    timeout: 2000

# 2.7. Ana Sayfayı Kaydırarak İncele
- swipe:
    direction: UP
    duration: 600
- swipe:
    direction: DOWN
    duration: 600

# ══════════════════════════════════════════════════════════════════
# 3. YAPI & SAKİN SEKMESİ (DAİRE VE SÖZLEŞMELER)
# ══════════════════════════════════════════════════════════════════
- tapOn:
    point: "30%, 90%"
- waitForAnimationToEnd:
    timeout: 3000
- swipe:
    direction: UP
    duration: 600
- swipe:
    direction: DOWN
    duration: 500

# ══════════════════════════════════════════════════════════════════
# 4. FİNANS & AİDAT YÖNETİMİ (BORÇLAR VE ÖDEMELER)
# ══════════════════════════════════════════════════════════════════
- tapOn:
    point: "50%, 90%"
- waitForAnimationToEnd:
    timeout: 3000

# 4.1. Borçlar Sekmesi
- swipe:
    direction: UP
    duration: 600

# 4.2. Ödemeler Sekmesi (Sola Kaydır)
- swipe:
    direction: LEFT
    duration: 400
- waitForAnimationToEnd:
    timeout: 2000
- swipe:
    direction: UP
    duration: 600

# ══════════════════════════════════════════════════════════════════
# 5. OPERASYON & HİZMETLER (TALEPLER VE DUYURULAR)
# ══════════════════════════════════════════════════════════════════
- tapOn:
    point: "70%, 90%"
- waitForAnimationToEnd:
    timeout: 3000

# 5.1. Arıza ve Bakım Talepleri
- swipe:
    direction: UP
    duration: 600

# 5.2. Duyurular (Sola Kaydır)
- swipe:
    direction: LEFT
    duration: 400
- waitForAnimationToEnd:
    timeout: 2000
- swipe:
    direction: UP
    duration: 600

# ══════════════════════════════════════════════════════════════════
# 6. PROFİL, AYARLAR VE ÇIKIŞ YAP
# ══════════════════════════════════════════════════════════════════
- tapOn:
    point: "90%, 90%"
- waitForAnimationToEnd:
    timeout: 3000

# 6.1. Şifre Değiştir Sayfasına Gir ve Geri Dön
- tapOn: "Şifre Değiştir"
- waitForAnimationToEnd:
    timeout: 2000
- back
- waitForAnimationToEnd:
    timeout: 2000

# 6.2. Bildirim Tercihleri Sayfasına Gir ve Geri Dön
- tapOn: "Bildirim Tercihleri"
- waitForAnimationToEnd:
    timeout: 2000
- back
- waitForAnimationToEnd:
    timeout: 2000

# 6.3. Sayfanın en altındaki Çıkış Yap butonunu görmek için yukarı kaydır
- swipe:
    direction: UP
    duration: 500

# 6.4. Çıkış Yap Butonuna Bas
- tapOn: "Çıkış Yap"
- waitForAnimationToEnd:
    timeout: 2000

# Onay kutusundaki kırmızı Çıkış Yap butonuna bas
- tapOn:
    point: "72%, 56%"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Tekrar Hoş Geldiniz"

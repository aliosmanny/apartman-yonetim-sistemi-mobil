# ══════════════════════════════════════════════════════════════════
# 6. SEKMELER (5/6): HİZMETLER (OPERASYON & SERVİSLER)
# ══════════════════════════════════════════════════════════════════
- tapOn:
    point: "75%, 90%"
- waitForAnimationToEnd:
    timeout: 3000

# 6.1. Hizmetler listesini kaydır
- swipe:
    start: "50%, 65%"
    end: "50%, 35%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 1000
- swipe:
    start: "50%, 35%"
    end: "50%, 65%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 1000

# 6.2. Bakım Talepleri Sayfasına Gir ve Yeni Talep Oluştur
- tapOn: "Bakım Talepleri.*"
- waitForAnimationToEnd:
    timeout: 3000

# 6.2.1. FAB (+) ile Bakım Talebi Ekle Sayfasını Aç
- tapOn:
    point: "88%, 81%"
- waitForAnimationToEnd:
    timeout: 2000

# 6.2.2. Talep Bilgilerini Doldur
- tapOn: "Talep Başlığı.*"
- inputText: "Otopark Otomatik Kapı Arızası"
- tapOn: "Açıklama.*"
- inputText: "Sensör okumuyor, acil kontrol gerekiyor."
- hideKeyboard

# 6.2.3. Personel Ata (Ali Kaya)
- tapOn: "Atanan Personel.*"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn: "Ali Kaya.*"
- waitForAnimationToEnd:
    timeout: 1000

# 6.2.4. Daire Seçimi
- tapOn: "Daire.*"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    point: "50%, 45%"
- waitForAnimationToEnd:
    timeout: 1000

# 6.2.5. Kaydet ve Talebi Oluştur
- swipe:
    start: "50%, 75%"
    end: "50%, 35%"
    duration: 350
- tapOn: "Kaydet"
- waitForAnimationToEnd:
    timeout: 4000

# 6.2.6. Talepler Listesinde sekmeleri kaydır ve geri dön
- swipe:
    start: "80%, 40%"
    end: "20%, 40%"
    duration: 350
- waitForAnimationToEnd:
    timeout: 1500
- swipe:
    start: "80%, 40%"
    end: "20%, 40%"
    duration: 350
- waitForAnimationToEnd:
    timeout: 1500
- back
- waitForAnimationToEnd:
    timeout: 2000

# ══════════════════════════════════════════════════════════════════
# 7. SEKMELER (6/6): MENÜ & GÜVENLİ ÇIKIŞ YAPMA
# ══════════════════════════════════════════════════════════════════
- tapOn:
    point: "92%, 90%"
- waitForAnimationToEnd:
    timeout: 3000

# 7.1. Menü sayfasını kaydırarak incele
- swipe:
    start: "50%, 65%"
    end: "50%, 35%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 1000
- swipe:
    start: "50%, 35%"
    end: "50%, 65%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 1000

# 7.2. Güvenli Çıkış Yap
- tapOn: "Çıkış Yap.*"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    point: "72%, 56%"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Tekrar Hoş Geldiniz"





appId: com.example.apartman_yonetim_sistemi_mobil
---
# ══════════════════════════════════════════════════════════════════
# 1. YÖNETİCİ GİRİŞİ (AUTHENTICATION)
# ══════════════════════════════════════════════════════════════════
- launchApp:
    clearState: true
- tapOn: "5XX XXX XX XX"
- inputText: "5445401710"
- tapOn: "••••••••"
- inputText: "ahmet123"
- hideKeyboard
- tapOn: "Giriş Yap"
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible: "Hızlı Eylemler"

# ══════════════════════════════════════════════════════════════════
# 2. SEKMELER (1/6): ANA SAYFA & BİLDİRİMLER
# ══════════════════════════════════════════════════════════════════
# 2.1. Sağ üstteki Bildirim Zil İkonuna tıkla
- tapOn:
    point: "76%, 15%"
- waitForAnimationToEnd:
    timeout: 3000

# Bildirimler sayfasını güvenli kaydır ve geri dön
- swipe:
    start: "50%, 65%"
    end: "50%, 35%"
    duration: 400
- back
- waitForAnimationToEnd:
    timeout: 2000

# 2.2. Ana Sayfayı güvenli merkezden kaydır
- swipe:
    start: "50%, 70%"
    end: "50%, 30%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 1000
- swipe:
    start: "50%, 30%"
    end: "50%, 70%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 1000

# ══════════════════════════════════════════════════════════════════
# 3. SEKMELER (2/6): KULLANICILAR SEKMESİ
# ══════════════════════════════════════════════════════════════════
- tapOn:
    point: "25%, 90%"
- waitForAnimationToEnd:
    timeout: 3000

# 3.1. Kullanıcı listesini güvenli kaydır
- swipe:
    start: "50%, 65%"
    end: "50%, 35%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 1000
- swipe:
    start: "50%, 35%"
    end: "50%, 65%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 1000

# ══════════════════════════════════════════════════════════════════
# 4. SEKMELER (3/6): YAPI & SAKİN (TÜM ALT SEKMELER)
# ══════════════════════════════════════════════════════════════════
- tapOn:
    point: "42%, 90%"
- waitForAnimationToEnd:
    timeout: 3000

# 4.1. Apartmanlar sekmesi: İlk apartmanın Çoğalt butonunu dene
- tapOn: "Çoğalt"
- waitForAnimationToEnd:
    timeout: 3000
- back
- waitForAnimationToEnd:
    timeout: 2000

# 4.2. Bloklar Alt Sekmesi
- swipe:
    start: "80%, 40%"
    end: "20%, 40%"
    duration: 350
- waitForAnimationToEnd:
    timeout: 1500
- swipe:
    start: "50%, 60%"
    end: "50%, 35%"
    duration: 350

# 4.3. Daireler Alt Sekmesi
- swipe:
    start: "80%, 40%"
    end: "20%, 40%"
    duration: 350
- waitForAnimationToEnd:
    timeout: 1500
- swipe:
    start: "50%, 60%"
    end: "50%, 35%"
    duration: 350

# 4.4. Kat Malikleri Alt Sekmesi
- swipe:
    start: "80%, 40%"
    end: "20%, 40%"
    duration: 350
- waitForAnimationToEnd:
    timeout: 1500
- swipe:
    start: "50%, 60%"
    end: "50%, 35%"
    duration: 350


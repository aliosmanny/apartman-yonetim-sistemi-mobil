    duration: 350

# ══════════════════════════════════════════════════════════════════
# 5. SEKMELER (4/6): FİNANS YÖNETİMİ (TÜM ALT SEKMELER)
# ══════════════════════════════════════════════════════════════════
- tapOn:
    point: "58%, 90%"
- waitForAnimationToEnd:
    timeout: 3000

# 5.1. Aidat Dönemleri
- swipe:
    start: "50%, 65%"
    end: "50%, 35%"
    duration: 400

# 5.2. Borçlar
- swipe:
    start: "80%, 40%"
    end: "20%, 40%"
    duration: 350
- waitForAnimationToEnd:
    timeout: 1500
- swipe:
    start: "50%, 65%"
    end: "50%, 35%"
    duration: 400

# 5.3. Ödemeler
- swipe:
    start: "80%, 40%"
    end: "20%, 40%"
    duration: 350
- waitForAnimationToEnd:
    timeout: 1500
- swipe:
    start: "50%, 65%"
    end: "50%, 35%"
    duration: 400

# 5.4. Gelirler
- swipe:
    start: "80%, 40%"

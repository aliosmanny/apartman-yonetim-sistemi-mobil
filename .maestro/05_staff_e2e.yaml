appId: com.example.apartman_yonetim_sistemi_mobil
---
# ══════════════════════════════════════════════════════════════════
# 1. PERSONEL GİRİŞİ (ALİ KAYA)
# ══════════════════════════════════════════════════════════════════
- launchApp:
    clearState: true
- tapOn: "5XX XXX XX XX"
- inputText: "5814904199"
- tapOn: "••••••••"
- inputText: "DemoUser123!"
- hideKeyboard
- tapOn: "Giriş Yap"
- waitForAnimationToEnd:
    timeout: 8000

# ══════════════════════════════════════════════════════════════════
# 2. PERSONEL ANA SAYFA VE KISAYOLLAR
# ══════════════════════════════════════════════════════════════════
# 2.1. İstatistik Kısayolu: Bekleyen
- tapOn: ".*Bekleyen.*"
- waitForAnimationToEnd:
    timeout: 2500
# Ana Sayfaya Geri Dön (Sekme 0)
- tapOn:
    point: "12%, 90%"
- waitForAnimationToEnd:
    timeout: 2000

# 2.2. İstatistik Kısayolu: Tamamlanan
- tapOn: ".*Tamamlanan.*"
- waitForAnimationToEnd:
    timeout: 2500
# Ana Sayfaya Geri Dön
- tapOn:
    point: "12%, 90%"
- waitForAnimationToEnd:
    timeout: 2000

# 2.3. 'Tümü' Kısayol Butonu
- tapOn: "Tümü"
- waitForAnimationToEnd:
    timeout: 2500
# Ana Sayfaya Geri Dön
- tapOn:
    point: "12%, 90%"
- waitForAnimationToEnd:
    timeout: 2000

# 2.4. Ana Sayfayı Güvenli Kaydırarak İncele
- swipe:
    start: "50%, 65%"
    end: "50%, 35%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 1000
- swipe:
    start: "50%, 35%"
    end: "50%, 65%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 1000

# ══════════════════════════════════════════════════════════════════
# 3. ATANAN GÖREVLER SEKMESİ & İŞİ TAMAMLAMA AKIŞI
# ══════════════════════════════════════════════════════════════════
- tapOn:
    point: "38%, 90%"
- waitForAnimationToEnd:
    timeout: 3000

# 3.1. Atanan İşe Tıkla ve Detay Sayfasına Git
- tapOn: ".*Otopark.*"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "İş Detayı"

# 3.2. Personel Notu Ekle
- tapOn: "Yapılan işlemleri kısaca açıklayın..."
- inputText: "Kapı sensörü temizlendi ve onarım tamamlandı."
- hideKeyboard

# 3.3. 'İşi Tamamla' Butonuna Bas
- swipe:
    start: "50%, 75%"
    end: "50%, 35%"
    duration: 350
- tapOn: "İşi Tamamla"
- waitForAnimationToEnd:
    timeout: 4000

# ══════════════════════════════════════════════════════════════════
# 4. TAMAMLANAN GÖREVLER SEKMESİ & DOĞRULAMA
# ══════════════════════════════════════════════════════════════════
- tapOn:
    point: "62%, 90%"
- waitForAnimationToEnd:
    timeout: 3000

# 4.1. Tamamlanan Listesinde Görevin Olduğunu Doğrula
- assertVisible: ".*Otopark.*"
- assertVisible: ".*Tamamlandı.*"

# 4.2. Tamamlananlar Listesini Kaydır
- swipe:
    start: "50%, 65%"
    end: "50%, 35%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 1000
- swipe:
    start: "50%, 35%"
    end: "50%, 65%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 1000

# ══════════════════════════════════════════════════════════════════
# 5. PROFİL, AYARLAR VE ÇIKIŞ YAP
# ══════════════════════════════════════════════════════════════════
- tapOn:
    point: "88%, 90%"
- waitForAnimationToEnd:
    timeout: 3000

# 5.1. Profil Bilgileri Sayfasına Gir ve Geri Dön
- tapOn: "Profil Bilgileri"
- waitForAnimationToEnd:
    timeout: 2000
- back
- waitForAnimationToEnd:
    timeout: 2000

# 5.2. Uygulama Ayarları Sayfasına Gir ve Geri Dön
- tapOn: "Uygulama Ayarları"
- waitForAnimationToEnd:
    timeout: 2000
- back
- waitForAnimationToEnd:
    timeout: 2000

# 5.3. Şifre Değiştir Sayfasına Gir ve Geri Dön
- tapOn: "Şifre Değiştir"
- waitForAnimationToEnd:
    timeout: 2000
- back
- waitForAnimationToEnd:
    timeout: 2000

# 5.4. Çıkış Yap
- tapOn: "Çıkış Yap"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    point: "72%, 56%"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Tekrar Hoş Geldiniz"

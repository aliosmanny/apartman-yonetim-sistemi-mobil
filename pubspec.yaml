name: apartman_yonetim_sistemi_mobil
description: "Apartman Yönetim Sistemi — Mobil Uygulama"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  webview_flutter: ^4.8.0
  flutter:
    sdk: flutter

  # ── Navigasyon ──────────────────────────────────
  go_router: ^14.6.1

  # ── State Management ────────────────────────────
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # ── Network ─────────────────────────────────────
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # ── Dependency Injection ─────────────────────────
  get_it: ^8.0.3

  # ── JSON Serialization ───────────────────────────
  json_annotation: ^4.9.0

  # ── Storage ─────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # ── Tipografi ───────────────────────────────────
  google_fonts: ^6.2.1

  # ── UI & Animasyon ──────────────────────────────
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # ── Dosya & Medya ───────────────────────────────
  image_picker: ^1.1.2
  file_picker: ^8.1.3
  open_filex: ^4.6.0
  url_launcher: ^6.3.1

  # ── Yardımcı ────────────────────────────────────
  intl: ^0.19.0
  logger: ^2.4.0
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^18.0.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  webview_flutter: ^4.8.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_logo.jpg"
  remove_alpha_ios: true
